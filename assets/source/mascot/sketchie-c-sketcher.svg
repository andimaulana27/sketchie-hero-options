<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 130" fill="none" data-mascot="sketcher" style="color:var(--sk-ink,#1E1E28)">
  <!-- Concept C "Sketcher" — the Inkling orb holding a marker, drawing the scene itself.
       Ties the mascot to the product mechanic: Sketchie draws your explanation.
       The trailing ground line is the draw-on animation hook (animate stroke-dashoffset). -->
  <g class="fill" stroke="none">
    <circle cx="58" cy="56" r="40" fill="var(--sk-c1,#6C5CE7)"/>
    <path d="M84 27 C95 36 100 51 95 66 C91 79 81 89 68 93 C87 82 94 65 90 49 C87 39 83 32 76 26 C79 25.5 81.5 25.7 84 27 Z" fill="var(--sk-c2,#E8538F)"/>
    <path d="M93 60 C93 72 85 86 71 92 C83 81 88 70 88 58 C90 57 92 58 93 60 Z" fill="var(--sk-c3,#FF6B5B)"/>
    <path d="M37 26 C42 22 49 20 55 21 C48 24 43 28 40 33 C37 31 37 29 37 26 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <g class="ink" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 16 C81 16 98 33 98 56 C98 79 81 96 58 96 C35 96 18 79 18 56 C18 34 36 16 58 16 Z"/>
    <!-- arm reaching to the marker -->
    <path d="M88 78 C99 80 106 85 110 92"/>
  </g>
  <!-- marker in hand, angled, mid-stroke -->
  <g class="marker">
    <path d="M108 84 L122 98 L114 106 L100 92 Z" fill="var(--sk-c2,#E8538F)" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round"/>
    <path d="M114 106 L122 98 L132 110 L128 114 Z" fill="currentColor" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round"/>
  </g>
  <!-- the line it is drawing: wobbly, trails back under the body -->
  <path class="drawn-line" d="M130 114 C104 120 66 121 34 117 C24 115.5 14 113 8 110"
        stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"/>
  <g class="face">
    <circle cx="46" cy="53" r="5.5" fill="currentColor"/>
    <circle cx="71" cy="53" r="5.5" fill="currentColor"/>
    <circle cx="47.8" cy="51" r="1.8" fill="#FFFFFF"/>
    <circle cx="72.8" cy="51" r="1.8" fill="#FFFFFF"/>
    <!-- eyes track the pen: pupils offset handled by glint position; brow adds focus -->
    <path d="M40 42 C43 40 47 39.5 50 40.5" stroke="currentColor" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M49 68 C54 73 63 73.5 68 69" stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"/>
    <ellipse cx="37" cy="62" rx="5" ry="3" fill="var(--sk-c2,#E8538F)" opacity="0.55"/>
  </g>
</svg>
