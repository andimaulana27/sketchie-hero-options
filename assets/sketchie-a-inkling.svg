<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" data-mascot="inkling" style="color:var(--sk-ink,#1E1E28)">
  <!-- Concept A "Inkling" — clean doodle orb. Flat color zones echo the ManiAI gradient
       (violet -> pink -> coral) redrawn as marker patches. Minimal face, maximum warmth. -->
  <g class="fill" stroke="none">
    <circle cx="60" cy="58" r="42" fill="var(--sk-c1,#6C5CE7)"/>
    <path d="M88 27 C99 37 104 52 99 68 C95 81 84 92 70 96 C90 84 97 66 93 50 C90 39 86 32 79 26 C82 25.5 85 25.6 88 27 Z" fill="var(--sk-c2,#E8538F)"/>
    <path d="M97 62 C97 74 88 89 74 95 C86 84 92 72 92 60 C94 59 96 60 97 62 Z" fill="var(--sk-c3,#FF6B5B)"/>
    <path d="M38 26 C43 22 51 20 57 21 C50 24 45 28 42 33 C39 31 38 29 38 26 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>
  <g class="ink" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- double-pass hand-drawn outline -->
    <path d="M60 16 C84 16 102 34 102 58 C102 82 84 100 60 100 C36 100 18 82 18 58 C18 35 37 16 60 16 Z"/>
    <path d="M25 38 C21 44 19 51 19 58" stroke-width="3.5" opacity="0.7"/>
    <path d="M96 74 C99 69 101 64 101.5 58" stroke-width="3.5" opacity="0.7"/>
  </g>
  <g class="face">
    <circle cx="47" cy="55" r="5.5" fill="currentColor"/>
    <circle cx="73" cy="55" r="5.5" fill="currentColor"/>
    <circle cx="48.8" cy="53" r="1.8" fill="#FFFFFF"/>
    <circle cx="74.8" cy="53" r="1.8" fill="#FFFFFF"/>
    <path d="M50 70 C55 75.5 65 75.5 70 70" stroke="currentColor" stroke-width="5" stroke-linecap="round" fill="none"/>
    <ellipse cx="38" cy="64" rx="5" ry="3" fill="var(--sk-c2,#E8538F)" opacity="0.55"/>
    <ellipse cx="82" cy="64" rx="5" ry="3" fill="var(--sk-c2,#E8538F)" opacity="0.55"/>
  </g>
</svg>
